name: FAMBIT Firebase
on:
  pull_request:
    paths: ['firebase/**', 'firebase.json', 'scripts/**', 'tests/**', 'app/**', 'lib/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/firebase-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Dependencias reproducibles
        run: |
          npx --yes pnpm@11.19.0 install --frozen-lockfile
          npm ci --ignore-scripts --prefix firebase/functions
          npm ci --ignore-scripts --prefix firebase/tooling
      - name: Tipos y regresión del servidor portable
        run: |
          node node_modules/typescript/bin/tsc --noEmit --incremental false
          npm run build:selfhost
          node --test --test-timeout=120000 tests/service.test.mjs tests/migration.test.mjs tests/production.test.mjs
      - name: Firebase completo con emuladores, sin proyecto de pago
        run: node scripts/test-firebase.mjs
      - name: Auditoría de dependencias del servidor Firebase
        run: npm audit --omit=dev --audit-level=moderate --prefix firebase/functions
